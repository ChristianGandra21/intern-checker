name: Busca diária de vagas

on:
  schedule:
    - cron: "15 11 * * *" # 08:15 em São Paulo (UTC-3)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/pyproject.toml
      - name: Instalar coletor
        run: |
          pip install './collector[dynamic]'
          playwright install --with-deps chromium
      - name: Buscar, classificar e entregar vagas
        env:
          JOBS_API_URL: ${{ secrets.JOBS_API_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ALERTS_IMAP_USER: ${{ secrets.ALERTS_IMAP_USER }}
          ALERTS_IMAP_PASSWORD: ${{ secrets.ALERTS_IMAP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: intern-checker run --config config/sources.yml --output exports
      - name: Revalidar duplicatas, idade e links prioritários
        continue-on-error: true
        env:
          JOBS_API_URL: ${{ secrets.JOBS_API_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
        run: |
          if [ -n "$JOBS_API_URL" ] && [ -n "$INGEST_API_KEY" ]; then
            curl --fail-with-body --silent --show-error --max-time 60 \
              -X POST "${JOBS_API_URL%/}/revalidate" \
              -H "content-type: application/json" \
              -H "x-ingest-key: $INGEST_API_KEY" \
              -d '{"check_urls":true,"url_limit":30}'
          fi
      - name: Guardar planilhas do ciclo
        uses: actions/upload-artifact@v4
        with:
          name: vagas-${{ github.run_id }}
          path: exports/
          retention-days: 30
          if-no-files-found: error
