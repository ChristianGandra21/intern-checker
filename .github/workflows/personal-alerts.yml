name: Alertas pessoais

on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Processar caixa de entrada, resumos e prazos
        env:
          JOBS_API_URL: ${{ secrets.JOBS_API_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
        run: |
          if [ -z "$JOBS_API_URL" ] || [ -z "$INGEST_API_KEY" ]; then
            echo "::warning::Alertas não processados: configure os secrets JOBS_API_URL e INGEST_API_KEY."
            exit 0
          fi
          JOBS_API_URL="${JOBS_API_URL%/}"
          STATUS_ROOT="${JOBS_API_URL%/api/jobs}"
          curl --retry 3 --retry-all-errors --fail-with-body --silent --show-error --max-time 60 \
            -X POST "$STATUS_ROOT/api/notifications/process" \
            -H "x-ingest-key: $INGEST_API_KEY"
