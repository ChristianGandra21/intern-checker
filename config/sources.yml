pipeline:
  source_timeout_seconds: 45

search:
  max_results: 6
  concurrency: 6
  region: br-pt
  timelimit: m
  backend: yandex
  timeout: 5

pages:
  concurrency: 6

enrichment:
  concurrency: 12
  limit: 140
  timeout_seconds: 10
  stage_timeout_seconds: 120

ats:
  concurrency: 4
  # Fontes descobertas são persistidas no backend; entradas curadas podem ser adicionadas aqui.
  sources: []
  # Exemplo: { name: Acme, company: Acme, adapter: greenhouse, identifier: acme, enabled: true }

community_sheet:
  spreadsheet_id: 13lutgdWIY7ezc-6PihVQcjWaqsdk0Pb-SBIEDpHx9as
  timezone: America/Sao_Paulo
  current_month_only: true

rendered_pages:
  concurrency: 2
  pages:
    - name: Infojobs — estágio 2027
      source: Infojobs
      company: Não informada
      url: https://www.infojobs.com.br/empregos.aspx?palabra=est%C3%A1gio%202027
      item_selector: a[href*="vaga-de-"]
      limit: 40
    - name: Catho — estágio 2027
      source: Catho
      company: Não informada
      url: https://www.catho.com.br/vagas/estagio-2027/
      item_selector: a[href*="/vaga/"], a[href*="/vagas/"]
      limit: 40
    - name: Solides — estágio 2027
      source: Solides
      company: Não informada
      url: https://vagas.solides.com.br/vagas?search=est%C3%A1gio%202027
      item_selector: a[href*="/vaga/"], a[href*="/vagas/"]
      limit: 40

social:
  concurrency: 6
  # Reddit e Bluesky permanecem suportados, mas ficam desligados enquanto retornarem 403.
  bluesky: []
  reddit: []
  hackernews:
    - query: 'internship 2027 Brazil remote'
      limit: 50
    - query: '"early careers" 2027 remote'
      limit: 50
  mastodon:
    - instance: https://mastodon.social
      tag: estagio
      limit: 25
    - instance: https://mastodon.social
      tag: vagas
      limit: 25
    - instance: https://fosstodon.org
      tag: internship
      limit: 25
  telegram:
    - channel: vagasremotas
      query: estágio 2027
      limit: 40
    - channel: vagasdeestagio
      query: 2027
      limit: 40

scoring:
  # Usado apenas para ranking/dashboard. A ingestion não descarta por score por padrão.
  minimum: 55

searches:
  - source: Web
    query: '(estágio OR estagiário OR intern) (dados OR analytics OR "inteligência artificial" OR "machine learning") ("São Paulo" OR remoto OR Brasil)'
  - source: Web
    query: '(estágio OR estagiário OR intern) (software OR desenvolvimento OR backend OR frontend OR QA) ("São Paulo" OR remoto OR Brasil)'
  - source: Web
    query: '(estágio OR estagiário OR intern) ("produto digital" OR product OR UX OR UI) ("São Paulo" OR remoto OR Brasil)'
  - source: Web
    query: '(estágio OR estagiário OR intern) (cloud OR devops OR infraestrutura OR cibersegurança OR "segurança da informação") ("São Paulo" OR remoto OR Brasil)'
  - source: Web
    query: '("programa de estágio" OR "jovens talentos") (tecnologia OR dados OR software OR produto) (Brasil OR "São Paulo" OR remoto)'
  - source: LinkedIn
    query: 'site:linkedin.com/jobs/view ("programa de estágio 2027" OR "estágio 2027" OR internship) ("São Paulo" OR remoto OR Brasil)'
  - source: LinkedIn
    query: 'site:linkedin.com/jobs/view ("estágio" OR "estagiário") ("2027" OR "2027.1" OR "1.2027")'
  - source: X
    query: 'site:x.com (vaga OR oportunidade OR inscrições) ("programa de estágio" OR "estágio") 2027'
  - source: X
    query: 'site:x.com ("estágio 2027" OR "programa de estágio 2027" OR "jovens talentos 2027")'
  - source: Bluesky
    query: 'site:bsky.app ("estágio 2027" OR "programa de estágio 2027" OR "jovens talentos 2027")'
  - source: Threads
    query: 'site:threads.net ("estágio 2027" OR "programa de estágio 2027")'
  - source: Gupy
    query: 'site:gupy.io ("programa de estágio 2027" OR "estágio 2027" OR "estagiário 2027")'
  - source: Gupy
    query: 'site:gupy.io/jobs ("estágio" OR "estagiário") ("2027" OR "primeiro semestre")'
  - source: Gupy
    query: 'site:portal.gupy.io/job-search ("estágio" OR "programa de estágio" OR "jovens talentos") 2027'
  - source: Vagas.com
    query: 'site:vagas.com.br/vagas-de ("estágio" OR "estagiário" OR "programa de estágio") 2027'
  - source: CIEE
    query: 'site:portal.ciee.org.br ("estágio" OR "programa de estágio") 2027'
  - source: Nube
    query: 'site:nube.com.br ("estágio" OR "programa de estágio") 2027'
  - source: Cia de Talentos
    query: 'site:ciadetalentos.com.br ("estágio" OR "jovens talentos" OR "early careers") 2027'
  - source: Cia de Estágios
    query: 'site:ciadeestagios.com.br ("estágio" OR "programa de estágio") 2027'
  - source: Eureca
    query: 'site:eureca.me ("estágio" OR "jovens talentos" OR "programa") 2027'
  - source: 99jobs
    query: 'site:99jobs.com ("estágio" OR "jovens talentos" OR "programa de estágio") 2027'
  - source: Super Estágios
    query: 'site:superestagios.com.br ("programa de estágio" OR "vaga de estágio") (Brasil OR "São Paulo" OR remoto)'
  - source: Estagiarios.com
