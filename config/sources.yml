  - source: O Trainee
    query: 'site:otrainee.com.br "programa de estágio" (Brasil OR "São Paulo")'
  - source: Indeed
    query: 'site:br.indeed.com ("estágio" OR intern) ("2027" OR "2027.1" OR "primeiro semestre") ("São Paulo" OR remoto OR Brasil)'
  - source: Glassdoor
    query: 'site:glassdoor.com.br ("estágio" OR intern) 2027 ("São Paulo" OR remoto OR Brasil)'
  - source: The Muse
    query: 'site:themuse.com ("intern" OR internship) 2027 Brazil remote'
  - source: Lever
    query: 'site:jobs.lever.co (estágio OR intern OR internship OR "early careers") 2027 Brazil'
  - source: Greenhouse
    query: 'site:boards.greenhouse.io (estágio OR intern OR internship OR "early careers") 2027 Brazil'
  - source: Ashby
    query: 'site:jobs.ashbyhq.com (estágio OR intern OR internship OR "early careers") 2027 Brazil'
  - source: Workday
    query: 'site:myworkdayjobs.com (estágio OR intern OR internship OR "early careers") 2027 Brazil'
  - source: Forums
    query: 'site:reddit.com (estágio OR internship OR "programa de estágio") 2027 Brasil'
  - source: Forums
    query: 'site:dev.to (internship OR estágio) 2027 Brazil'
  - source: Communities
    query: 'site:github.com (estágio OR internship) 2027 Brazil vagas'
  - source: Web
    query: '("programa de estágio 2027" OR "estágio 2027" OR "processo seletivo estágio 2027") ("São Paulo" OR remoto OR Brasil)'
  - source: Web
    query: '("inscrições abertas" OR "estão abertas") ("programa de estágio" OR "estágio") 2027'
  - source: Web
    query: '("estágio 2027.1" OR "estágio 1.2027" OR "primeiro semestre de 2027")'
  - source: Web
    query: '("jovens talentos 2027" OR "early careers 2027" OR "summer intern 2027") (Brasil OR Brazil OR remoto OR remote)'
  - source: Web
    query: '("programa de estágio" "2027/1" OR "programa de estágio" "2027-1" OR "programa de estágio" "1.2027")'

